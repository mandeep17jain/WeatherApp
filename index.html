<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/svg+xml" href="clouds.png" />
    <title>Weather App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
     <div id="warning">
        <div><b> WARNING !</b></div>
        <h5 id="warn-text"></h5>
        <button id="warn-btn">OK</button>
    </div>
    <!-- <div id="initial">
        Enter a City!
    </div> -->
    <div id="top-div"> 
        <div id="temp">
            <div id="city-name">MUMBAI</div>
           <div id="main-temp">
             <p id="act-temp">20 °C </p>
            <img id="temp-img" src="Haze.png" alt="whether"> 
           </div>
        </div>
        <div id="input-wind" >
            <div id="input-loc">
                <input id="input" type="text" placeholder="Search location here">
                <button id="SearchBtn">Search</button>
            </div>
            <div id="wind">
                <p id="speed">wind speed :</p>
                <p id="humid">humidity :</p>
            </div>
        </div>
    </div>
    <div id="down-div">
        <div class="box" id="1day">
            <p class="box-date"></p>
            <div class="temp-img">

                <img class="box-img" src="" alt="1img">
            </div>

                <p class="box-hum"></p>
            
        </div>

             <p class="box-date"></p>

                <p class="box-hum"></p>
            
        </div>
        <div class="box" id="3day">

                <p class="box-wind"></p>
                <p class="box-hum"></p>
            
        </div>
        <div class="box" id="4day">

            <div class="temp-img">

            </div>
                <p class="box-wind"></p>
                <p class="box-hum"></p>
           
        </div>
        <div class="box" id="5day">
              <p class="box-date"></p>
            <div class="temp-img">
                <p class="box-temp"></p>
                <img class="box-img" src="" alt="1img">
            </div>   
                <p class="box-wind"></p>
